# preprocessing stage (run after import_pgsql_prague.sh has filled the input
# schema): merge UrbanAtlas + OSM footprints into the landcover and process the
# DEM / building-height rasters. The results stay in the input schema, which
# prague_palm.yaml then builds the PALM domain from.
run_tasks:
  - urban_atlas_osm
  - urban_atlas_dem_buildings

input_schema: 'inputs_prague'
process_streetmaps: True   # merge the OSM building footprints (off by default)

srid_input: 32633
srid_palm: 32633
srid: 32633
srid_utm: 32633

domain:
    name: 'inputs_prague'
    scenario: ''
    xl: 456419
    xh: 463116
    yl: 5546182
    yh: 5553244
    crop_domain: True
    fill_boundary: False
