        long_name: 'wall layer volumetric heat capacity'
        units: 'J/m3/K'
        dims: 'nwallyx'

    c_window:
        vt: 'f4'
        long_name: 'window layer volumetric heat capacity'
        units: 'J/m3/K'
        dims: 'nwinyx'

    dz_road:
        vt: 'f4'
        long_name: 'road layer thickness'
        units: 'm'
        dims: 'nroadyx'

    dz_roof:
        vt: 'f4'
        long_name: 'roof layer thickness'
        units: 'm'
        dims: 'nroofyx'

    dz_wall:
        vt: 'f4'
        long_name: 'wall layer thickness'
        units: 'm'
        dims: 'nwallyx'

    dz_window:
        vt: 'f4'
        long_name: 'window layer thickness'
        dims: 'nwinyx'
        units: 'm'

    emiss_road:
        vt: 'f4'
        long_name: 'road surface emissivity'
        units: '1'
        dims: 'yx'

    emiss_roof:
        vt: 'f4'
        long_name: 'roof surface emissivity'
        units: '1'
        dims: 'yx'

    emiss_wall:
