slurb: False

# default dimensions
ndims_slurb:
    nroad_3d: 4
    nroof_3d: 4
    nwall_3d: 4
    nwin_3d: 4

# common values
center_line_length: 15.0 # m
building_outer_wall_lenght: 15.0 # m
default_building_height: 20.0 # m

# general rules
min_plan_area: 0.2  # fraction of buildings where slurm is applied, else use LSM only

# reference window for the urban morphology (PG-72). The SLUrb guide: the
# morphological parameters "are well-defined only for reference areas of at
# least 100x100 m2", so plan/urban/frontal fractions and building height are
# averaged over a sliding window centred on each cell (odd cell count, e.g.
# 11 cells = 110 m at dx = 10 m), and min_plan_area is applied to the windowed
# plan fraction in both drivers. 0 (or <= dx) = per grid cell.
slurb_reference_size: 100.0 # m

# street canyon assignment to urban cells (PG-69): each urban cell takes up to
# canyon_neighbours nearest canyon samples (points on the street centre line)
# within canyon_search_radius; 50 m is the probe length prepare_slurb uses to
# find the buildings on both sides of a street
canyon_search_radius: 50.0 # m
canyon_neighbours: 3
# orientation only where the streets within canyon_search_radius share a
# direction (PG-74): coherence R = |length-weighted mean of doubled street
# bearings| (0 = all directions, 1 = parallel). Below the threshold the
# orientation is written as fill value = isotropic canyon (PIDS_SLURB).
# 0 = keep every orientation.
canyon_orientation_min_coherence: 0.4

# building_frontal_area_fraction = facade area * frontal_area_factor / cell area
# (PG-71). 0.31831 = 1/pi: frontal area averaged over all wind directions for
# convex buildings (Cauchy: mean projected width = perimeter / pi). 0.25 = wind
# normal to one face of a square building; 1.0 = full facade-to-plan ratio.
frontal_area_factor: 0.31831

# how the static driver describes the land surface in SLURB mode (PG-70).
# PALM-SLUrb models the urban part of a cell (buildings + streets, see
# urban_fraction) and PALM-LSM the rest, so the static driver keeps the real
# LSM types outside SLUrb cells and gives SLUrb cells (building plan fraction
# >= min_plan_area) their dominant non-urban type (vegetation or water).
slurb_lsm_bare_soil: False    # True = legacy: every non-building landcover type -> 101 (bare soil)
slurb_lsm_default_type: 103   # landcover type for SLUrb cells without vegetation/water (103 = short grass)

# define variable with attributes
# NOTE: only variables actually derived from the input sources are
# written to the slurb driver. The commented entries are constant placeholders
# (hardcoded defaults, not calculated from any input) — re-enable them once
# more detailed inputs are handled.
slurb_vars_done: [
#    'deep_soil_temperature',        # constant 273.15 K placeholder
    'building_frontal_area_fraction',
    'building_height',
#    'building_indoor_temperature',  # constant 273.15 K placeholder
    'building_plan_area_fraction',
    'building_type',                 # median landcover building type (9xx - 900) of the cell, nearest cell where it has none (as pre-2.0)
#    'pavement_type',                # constant type 1 placeholder
    'street_canyon_aspect_ratio',
    'street_canyon_orientation',
    'urban_fraction'                 # building + pavement share of the cell (PG-69)
    ]
slurb_vars:
    deep_soil_temperature:
        vt: 'f4'
        long_name: 'deep soil temperature'
        units: 'K'
        dims: 'yx'

    building_frontal_area_fraction:
        vt: 'f4'
        long_name: 'building frontal area fraction'
        units: '1'
        dims: 'yx'

    building_height:
        vt: 'f4'
        long_name: 'mean building height'
        units: 'm'
        dims: 'yx'

    building_indoor_temperature:
        vt: 'f4'
        long_name: 'indoor air temperature'
        units: 'K'
        dims: 'yx'

    building_plan_area_fraction:
        vt: 'f4'
        long_name: 'building plan area fraction'
        units: '1'
        dims: 'yx'

    building_type:
        vt: 'b'
        long_name: 'building type classification'
        units: '1'
        dims: 'yx'

    pavement_type:
        vt: 'b'
        long_name: 'pavement type classification'
        units: '1'
        dims: 'yx'

    street_canyon_aspect_ratio:
        vt: 'f4'
        long_name: 'street canyon aspect ratio'
        units: '1'
        dims: 'yx'

    street_canyon_orientation:
        vt: 'f4'
        long_name: 'street canyon orientation angle'
        units: 'deg'                 # compass heading of the canyon axis, 0 = south-north (PIDS_SLURB)
        dims: 'yx'

    urban_fraction:
        vt: 'f4'
        long_name: 'urban plan area fraction'
        units: '1'
        dims: 'yx'

    # Additional info
    albedo_road:
        vt: 'f4'
        long_name: 'road surface shortwave albedo'
        units: '1'
        dims: 'yx'

    albedo_roof:
        vt: 'f4'
        long_name: 'roof surface shortwave albedo'
        units: '1'
        dims: 'yx'

    albedo_wall:
        vt: 'f4'
        long_name: 'wall surface shortwave albedo'
        units: '1'
        dims: 'yx'

    albedo_window:
        vt: 'f4'
        long_name: 'window surface shortwave albedo'
        units: '1'
        dims: 'yx'

    c_road:
        vt: 'f4'
        long_name: 'road layer volumetric heat capacity'
        units: 'J/m3/K'
        dims: 'nroadyx'

    c_roof:
