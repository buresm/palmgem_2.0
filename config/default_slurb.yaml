        units: '1'

    window_fraction:
        vt: 'f4'
        long_name: 'window fraction'
        units: '1'
        dims: 'yx'

    z0_road:
        vt: 'f4'
        long_name: 'road surface aerodynamic roughness length for momentum'
        units: 'm'
        dims: 'yx'

    z0_roof:
