slurb_vars_defaults:
  # albedo values
  albedo_road: 0.10
  albedo_roof: 0.17
  albedo_wall: 0.12
  albedo_window: 0.12
  # emissivity values
  emiss_road: 0.90
  emiss_roof: 0.90
  emiss_wall: 0.85
  emiss_window: 0.92
  # roughness lengths (m)
  z0_road: 0.01
  z0_roof: 0.01
  z0_wall: 0.01
  z0_window: 0.001
  # thermal properties (heat capacity J/m³K, conductivity W/mK, thickness m)
  road:
    c: 1.5e6
    lambda: 0.8
    dz: [0.05, 0.2, 0.3] # multi-layer support
  roof:
    c: 1.2e6
    lambda: 0.5
    dz: [0.02, 0.1, 0.15]
  wall:
    c: 1.0e6
    lambda: 0.7
    dz: [0.02, 0.2, 0.1]
  window:
    c: 2.0e6
    lambda: 1.0
    dz: [0.01]


